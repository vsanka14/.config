# Entry point. Order matters: options → theme → bindings → modes.
# Each module is self-contained; reload (prefix + r) re-sources this file.

source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/passthrough.conf
source-file ~/.config/tmux/wheel-scroll.conf
