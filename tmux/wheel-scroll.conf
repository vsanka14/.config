# --- Wheel-scroll mode -------------------------------------------------------
# Inject xterm SGR mouse-wheel sequences into the focused pane so you can
# scroll alt-screen TUIs (e.g. Copilot CLI) from the keyboard.
# Enter: prefix + s.  j/k = 1 line, u/d = ~3 lines, gg/G = top/bottom, C-e = exit.
# Sticky table: keys re-enter on each press. Yellow SCROLL indicator while active.

bind s \
  switch-client -T wheel-scroll \; \
  refresh-client -S

bind -T wheel-scroll k \
  send-keys -H 1b 5b 3c 36 34 3b 31 3b 31 4d \; \
  switch-client -T wheel-scroll

bind -T wheel-scroll j \
  send-keys -H 1b 5b 3c 36 35 3b 31 3b 31 4d \; \
  switch-client -T wheel-scroll

bind -T wheel-scroll u \
  send-keys -H 1b 5b 3c 36 34 3b 31 3b 31 4d \; \
  send-keys -H 1b 5b 3c 36 34 3b 31 3b 31 4d \; \
  send-keys -H 1b 5b 3c 36 34 3b 31 3b 31 4d \; \
  switch-client -T wheel-scroll

bind -T wheel-scroll d \
  send-keys -H 1b 5b 3c 36 35 3b 31 3b 31 4d \; \
  send-keys -H 1b 5b 3c 36 35 3b 31 3b 31 4d \; \
  send-keys -H 1b 5b 3c 36 35 3b 31 3b 31 4d \; \
  switch-client -T wheel-scroll

# G = jump to bottom (many wheel-down events)
bind -T wheel-scroll G \
  send-keys -N 200 -H 1b 5b 3c 36 35 3b 31 3b 31 4d \; \
  switch-client -T wheel-scroll

# gg = jump to top (two-key sequence via sub-table)
bind -T wheel-scroll g switch-client -T wheel-scroll-g
bind -T wheel-scroll-g g \
  send-keys -N 200 -H 1b 5b 3c 36 34 3b 31 3b 31 4d \; \
  switch-client -T wheel-scroll
bind -T wheel-scroll-g Escape switch-client -T wheel-scroll

bind -T wheel-scroll C-e \
  switch-client -T root \; \
  refresh-client -S
