# AeroSpace config - vim-centric tiling window manager
# https://nikitabobko.github.io/AeroSpace/guide

# Start AeroSpace at login
start-at-login = true

# Normalizations - keep enabled for intuitive behavior
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focus-changed = ['move-mouse window-lazy-center']

# Notify sketchybar on workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Default layout - accordion means windows stack (like tabs), not tile side-by-side
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'

# Gaps (minimal for clean look)
[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 6
outer.bottom = 6
outer.top = 40
outer.right = 6

# ============================================
# MAIN KEYBINDINGS (using ctrl modifier)
# ============================================
[mode.main.binding]

# Workspace switching (ctrl+number)
# 1=browser, 2=terminal, 3=misc
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'

# Window focus (ctrl+cmd+hjkl) — ctrl alone conflicts with terminal agents (ctrl+j = newline)
ctrl-cmd-h = 'focus left'
ctrl-cmd-j = 'focus down'
ctrl-cmd-k = 'focus up'
ctrl-cmd-l = 'focus right'

# Move window within workspace (ctrl+shift+hjkl)
ctrl-shift-h = 'move left'
ctrl-shift-j = 'move down'
ctrl-shift-k = 'move up'
ctrl-shift-l = 'move right'

# Move window to workspace (ctrl+shift+number)
ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'
ctrl-shift-3 = 'move-node-to-workspace 3'

# Layout controls
ctrl-f = 'fullscreen'                            # Toggle fullscreen
ctrl-comma = 'layout accordion horizontal'       # Stacked/accordion (default)
ctrl-period = 'layout tiles horizontal vertical' # Side-by-side tiles
ctrl-shift-space = 'layout floating tiling'      # Toggle floating <-> tiling

# Join controls - merge the focused window with the neighbor in a direction.
# Directional scheme, consistent with the rest: focus=ctrl+cmd, move=ctrl+shift,
# join=ctrl+alt. The hjkl direction = where the neighbor is.
# NOTE: with opposite-orientation normalization ON, joining two SIDE-BY-SIDE
# windows nests them into a VERTICAL stack (this is how you build a "2 stacked
# on the left + 1 on the right" master-stack layout).
# Recipe: ctrl+.  ->  focus the leftmost window  ->  ctrl+alt+l (join right)
# Un-join / exit a joined group with ctrl+alt+u (flatten) below.
ctrl-alt-h = 'join-with left'                    # Merge with the window to the LEFT
ctrl-alt-j = 'join-with down'                    # Merge with the window BELOW
ctrl-alt-k = 'join-with up'                      # Merge with the window ABOVE
ctrl-alt-l = 'join-with right'                   # Merge with the window to the RIGHT

# Un-join: dissolve ALL nesting/groups on the workspace back to a flat layout.
# This is how you "exit" a join you no longer want.
ctrl-alt-u = 'flatten-workspace-tree'

# Resize mode
ctrl-cmd-r = ['mode resize', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=resize']

# Close window (disabled to allow Neovim to use Ctrl+Q for quickfix)
# ctrl-q = 'close'

# Reload config (like tmux prefix+r)
ctrl-shift-r = 'reload-config'

# Reload sketchybar
ctrl-shift-s = 'exec-and-forget sketchybar --reload'

# Open app mode (ctrl+o, then key)
ctrl-cmd-o = ['mode open', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=open']

# ============================================
# RESIZE MODE
# ============================================
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
esc = ['mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
enter = ['mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']

# ============================================
# OPEN APP MODE (ctrl+o, then key)
# ============================================
[mode.open.binding]
c = ['exec-and-forget open -a "Google Chrome"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
f = ['exec-and-forget open -a "Finder"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
k = ['exec-and-forget open -a "kitty"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
m = ['exec-and-forget open -a "Messages"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
s = ['exec-and-forget open -b com.tinyspeck.slackmacgap', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
o = ['exec-and-forget open "$HOME/Applications/Chrome Apps.localized/Outlook (PWA).app"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
t = ['exec-and-forget open -a "Microsoft Teams"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
q = ['exec-and-forget open -a "QuickTime Player"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
a = ['exec-and-forget open -a "Activity Monitor"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
w = ['exec-and-forget open -a "WhatsApp"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
i = ['exec-and-forget open -a "iSTB"', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
# Toggle screen recording (start/stop). On stop, prompts for a name and
# re-encodes with ffmpeg to ~/Documents/screen-recordings/<name>.mov.
r = ['exec-and-forget $HOME/.config/bin/screen-record-toggle', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
esc = ['mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
enter = ['mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']

# ============================================
# FLOATING WINDOWS (dialogs, settings, etc.)
# ============================================
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SystemPreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'System Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Activity Monitor'
run = 'layout floating'

# ============================================
# APP-TO-WORKSPACE ASSIGNMENTS
# 1=browser, 2=terminal, 3=misc
# ============================================
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-name-regex-substring = '^Slack$'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = 'Outlook'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = 'Microsoft Teams'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = '^WhatsApp$'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = 'iSTB'
run = 'move-node-to-workspace 3'
